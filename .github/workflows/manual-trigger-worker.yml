name: Manual Trigger BioAI Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily, opportunity-batch, opportunity, project-opportunity, probe-primary, or probe-backup"
        required: true
        default: "opportunity-batch"
        type: string
      target_date:
        description: "Date in YYYY-MM-DD, defaults to Asia/Shanghai today"
        required: false
        type: string
      async:
        description: "Use async=1 for a quick 202 response"
        required: false
        default: "false"
        type: string
      dry_run:
        description: "Daily-only preview using dated cache; no GitHub or KV writes"
        required: false
        default: "false"
        type: boolean
      worker_url:
        description: "Optional approved BioAI version URL, preview only"
        required: false
        type: string

jobs:
  trigger:
    runs-on: ubuntu-latest
    env:
      DEFAULT_WORKER_BASE_URL: https://cloudflare-bioai-daily.sabrinamisan090.workers.dev
    steps:
      - name: Trigger worker endpoint
        shell: bash
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
          INPUT_ASYNC: ${{ github.event.inputs.async }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
          INPUT_WORKER_URL: ${{ github.event.inputs.worker_url }}
          WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
          TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
        run: |
          set -euo pipefail

          TARGET_DATE="${INPUT_TARGET_DATE:-}"
          if [[ -z "$TARGET_DATE" ]]; then
            TARGET_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          if [[ ! "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid target date: $TARGET_DATE"
            exit 1
          fi

          WORKER_BASE_URL="${WORKER_BASE_URL:-$DEFAULT_WORKER_BASE_URL}"
          if [[ -n "${INPUT_WORKER_URL:-}" ]]; then
            if [[ "${INPUT_MODE:-}" != "probe-primary" && "${INPUT_MODE:-}" != "probe-backup" ]] &&
               [[ "${INPUT_DRY_RUN:-false}" != "true" || "${INPUT_MODE:-}" != "daily" ]]; then
              echo "Version URLs are allowed only for daily previews or bounded model probes" >&2
              exit 1
            fi
            if [[ ! "$INPUT_WORKER_URL" =~ ^https://([a-z0-9-]+-)?cloudflare-bioai-daily\.sabrinamisan090\.workers\.dev/?$ ]]; then
              echo "Worker URL is not an approved BioAI host" >&2
              exit 1
            fi
            WORKER_BASE_URL="$INPUT_WORKER_URL"
          fi
          if [[ -z "${TRIGGER_SECRET:-}" ]]; then
            echo "TEST_TRIGGER_SECRET is not configured" >&2
            exit 1
          fi
          MODE="${INPUT_MODE:-opportunity-batch}"
          ASYNC_FLAG="${INPUT_ASYNC:-false}"

          if [[ "$MODE" == "probe-primary" || "$MODE" == "probe-backup" ]]; then
            if [[ "${INPUT_DRY_RUN:-false}" == "true" || "$ASYNC_FLAG" != "false" ]]; then
              echo "Model probes require dry_run=false and async=false" >&2
              exit 1
            fi
            ROUTE="${MODE#probe-}"
            status="$(curl -sS --max-time 35 -X POST -H "x-test-trigger-secret: ${TRIGGER_SECRET}" -o model-probe.json -w "%{http_code}" "${WORKER_BASE_URL%/}/testModelConnection?route=${ROUTE}" || true)"
            echo "Probe HTTP status: ${status:-000}"
            node -e 'const fs=require("fs");const r=JSON.parse(fs.readFileSync("model-probe.json","utf8"));console.log(JSON.stringify({ok:r.ok,route:r.route,requestedModel:r.requestedModel,status:r.status,timedOut:r.timedOut,error:r.error,milliseconds:r.milliseconds}));if(!r.ok)process.exitCode=1;'
            [[ "$status" == "200" ]]
            exit 0
          fi

          case "$MODE" in
            daily)
              PATH_PART="testTriggerScheduled"
              ;;
            opportunity|opportunity-batch)
              PATH_PART="testTriggerScheduledOpportunity"
              ;;
            project-opportunity)
              PATH_PART="testTriggerScheduledProjectOpportunity"
              ;;
            *)
              echo "Unsupported mode: $MODE"
              exit 1
              ;;
          esac

          URL="${WORKER_BASE_URL%/}/${PATH_PART}?key=${TRIGGER_SECRET}&date=${TARGET_DATE}&mode=${MODE}&sync=1"
          if [[ "$ASYNC_FLAG" == "true" || "$ASYNC_FLAG" == "1" ]]; then
            URL="${WORKER_BASE_URL%/}/${PATH_PART}?key=${TRIGGER_SECRET}&date=${TARGET_DATE}&mode=${MODE}&async=1"
          fi
          if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
            if [[ "$MODE" != "daily" || "$ASYNC_FLAG" == "true" || "$ASYNC_FLAG" == "1" ]]; then
              echo "Daily preview must be synchronous" >&2
              exit 1
            fi
            URL="${URL}&dryRun=1"
          fi

          echo "Mode: $MODE"
          echo "Date: $TARGET_DATE"
          echo "Endpoint: ${WORKER_BASE_URL%/}/${PATH_PART}"

          body_file="$(mktemp)"
          status="$(curl -sS --max-time 900 -o "$body_file" -w "%{http_code}" "$URL" || true)"
          response="$(cat "$body_file" 2>/dev/null || true)"
          rm -f "$body_file"

          echo "HTTP status: ${status:-000}"
          if [[ "${INPUT_DRY_RUN:-false}" == "true" ]]; then
            printf '%s' "$response" > preview.json
            node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync("preview.json","utf8")); if(r.result?.draftMarkdown) fs.writeFileSync("draft.md",r.result.draftMarkdown); if(!r.success || r.result?.dryRun!==true || !r.result?.markdown) throw new Error("Preview did not return a reviewed draft candidate"); fs.writeFileSync("preview.md",r.result.markdown); console.log(JSON.stringify({success:r.success,date:r.result.date,selectedCount:r.result.selectedCount,sourceCounts:r.result.sourceCounts,characters:r.result.markdown.length}));'
          else
            echo "Response:"
            echo "$response"
          fi

          if [[ "${status:-000}" -lt 200 || "${status:-000}" -ge 300 ]]; then
            exit 1
          fi

      - name: Upload preview artifact
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: bioai-daily-preview
          path: |
            preview.md
            preview.json
            draft.md
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload bounded probe result
        if: always() && startsWith(inputs.mode, 'probe-')
        uses: actions/upload-artifact@v4
        with:
          name: bioai-model-probe
          path: model-probe.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## Manual BioAI Worker Trigger"
            echo ""
            echo "- Mode: ${{ github.event.inputs.mode }}"
            echo "- Date: ${{ github.event.inputs.target_date }}"
            echo "- Async: ${{ github.event.inputs.async }}"
          } >> "$GITHUB_STEP_SUMMARY"
