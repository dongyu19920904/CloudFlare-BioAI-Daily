name: Opportunity Records CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/opportunity-records-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/opportunity-records-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Test all backend modules
        run: node --test tests/*.test.mjs
