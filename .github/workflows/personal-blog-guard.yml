name: Personal Blog Guard

on:
  schedule:
    - cron: '17 15 * * *'
    - cron: '17 23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD; empty selects the latest due Shanghai day'
        type: string
        required: false
      mode:
        description: 'Preview never writes blog files or production status'
        type: choice
        options: [publish, preview]
        default: publish
      worker_url:
        description: 'Optional approved version URL for preview only'
        type: string
        required: false

concurrency:
  group: personal-blog-guard
  cancel-in-progress: false

jobs:
  blog-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check and recover personal blogs only
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          BLOG_MODE: ${{ inputs.mode || 'publish' }}
          BLOG_WORKER_URL: ${{ inputs.mode == 'preview' && inputs.worker_url || '' }}
          TEST_TRIGGER_SECRET: ${{ secrets.TEST_TRIGGER_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/personal-blog-guard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-blog-report
          path: personal-blog-report.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Alert on incomplete publication
        if: failure() && inputs.mode != 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const report = fs.existsSync('personal-blog-report.json') ? JSON.parse(fs.readFileSync('personal-blog-report.json', 'utf8')) : null;
            const date = report?.date || new Date().toISOString().slice(0, 10);
            const title = `[Personal blog] Publication incomplete ${date}`;
            const existing = await github.rest.issues.listForRepo({...context.repo, state:'open', per_page:100});
            const body = `Personal blog recovery did not complete. BioAI daily/opportunity/project tasks were not triggered.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nMissing: ${(report?.missing || ['See run log']).join(', ')}`;
            const issue = existing.data.find(item => item.title === title);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number:issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
